name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta todos los días a las 05:00 UTC (evita horas pico de GitHub Actions)
    - cron: '0 5 * * *'
  workflow_dispatch: # Permite probarlo manualmente cuando quieras

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send ping request
        run: |
          # 1. Limpiar la URL eliminando /rest/v1 o barras al final si ya venían en el secret
          RAW_URL="${{ secrets.SUPABASE_URL }}"
          CLEAN_URL="${RAW_URL%/}"
          CLEAN_URL="${CLEAN_URL%/rest/v1}"

          # 2. Construir la URL exacta a la API
          TARGET_URL="${CLEAN_URL}/rest/v1/recetas?select=id&limit=1"
          echo "Petición a: ${TARGET_URL}"

          # 3. Ejecutar curl
          curl -i -X GET "${TARGET_URL}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
