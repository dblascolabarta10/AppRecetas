name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta todos los días a las 05:00 UTC (evita horas pico de GitHub Actions)
    - cron: '0 5 * * *'
  workflow_dispatch: # Permite probarlo manualmente cuando quieras

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send ping request
        run: |
          BASE_URL="${{ secrets.SUPABASE_URL }}"
          [[ "$BASE_URL" != */ ]] && BASE_URL="${BASE_URL}/"

          echo "URL objetivo: ${BASE_URL}rest/v1/recetas?select=id&limit=1"

          curl -i -X GET "${BASE_URL}rest/v1/recetas?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
